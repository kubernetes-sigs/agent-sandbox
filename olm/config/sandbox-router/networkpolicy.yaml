# Default NetworkPolicy for the sandbox-router.
#
# Ingress is open to all namespaces on the proxy port because the router is the
# entry point for sandbox traffic — clients, SDKs, and Gateway controllers can
# live in any namespace. The authz layer (--authz-mode) is the security
# boundary; tighten the from: clause if your deployment constrains callers to a
# known set of namespaces.
#
# Egress to sandbox pods is unrestricted on port because the upstream port is
# caller-specified (X-Sandbox-Port header, default 8888) and sandboxes can live
# in any namespace. Tighten via namespaceSelector/podSelector if your tenancy
# model constrains valid targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # Proxy traffic — open to all namespaces; see header comment.
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    # Uncomment when TLS is enabled:
    # - protocol: TCP
    #   port: 8443
  # Metrics scrape — restrict to your monitoring namespace.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Kubelet probes hit the pod IP directly; allow all sources.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # DNS for resolving sandbox FQDNs.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Forward traffic to sandbox pods. The upstream port is caller-specified
  # (X-Sandbox-Port header, default 8888) and sandboxes can live in any
  # namespace, so neither destination nor port is restricted.
  - to:
    - namespaceSelector: {}
  # OTel collector (if --enable-tracing or --enable-otel-metrics). Tighten
  # to your collector's namespace/pod selector.
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 4317
  # Kubernetes API server — required when --cache-enabled or
  # --authz-mode=tokenreview. The API server typically runs on host-network
  # control plane nodes, not as regular pods, so a namespaceSelector cannot
  # target it. This port-only rule (no "to" restriction) allows egress on
  # the standard API ports to any destination. Tighten with an ipBlock for
  # your API server ClusterIP if desired:
  #   kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}'
  # Skip this rule entirely when running with --cache-enabled=false AND
  # --authz-mode=allow-all (the OLM default).
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
