# SandboxTemplate for the cma-runner-pool warm pool. Each pod runs the
# managed-agents runner daemon on :8080; the controller claims one
# sandbox per CMA session and notifies it of work items over a port-forward.
# The cma-credentials Secret is required: the runner authenticates to
# Anthropic with the self-hosted environment key.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: cma-runner-template
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      # Makes the PVC-backed workspace group-writable for UID 1000.
      securityContext:
        fsGroup: 1000
      containers:
      - name: runner
        image: cma-runner:v1
        # kind-local image; for real clusters push to a registry (see README).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        env:
        - name: ANTHROPIC_ENVIRONMENT_ID
          valueFrom:
            secretKeyRef:
              name: cma-credentials
              key: ANTHROPIC_ENVIRONMENT_ID
        - name: ANTHROPIC_ENVIRONMENT_KEY
          valueFrom:
            secretKeyRef:
              name: cma-credentials
              key: ANTHROPIC_ENVIRONMENT_KEY
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            secretKeyRef:
              name: cma-credentials
              key: ANTHROPIC_BASE_URL
              optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "2Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
  # The workspace PVC is retained across suspend/resume, so a session's
  # files survive suspension even though the pod does not.
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
