# Standard Kubernetes DRA ResourceClaimTemplate referencing the cluster-admin
# DeviceClass "dra.agents.net" installed by github.com/aojea/agents.net/kubernetes.
#
# When a Sandbox or SandboxTemplate Pod references this template via
# podTemplate.spec.resourceClaims[].resourceClaimTemplateName, Kubernetes
# kube-controller-manager automatically creates one Pod-owned ResourceClaim per
# Pod and garbage-collects it when the Pod is suspended or deleted.
#
# Update policyEnforcementPoint.url, tls, auth, and caTrust to match your
# Policy Enforcement Point (PEP) gateway (for example agents.net connect-proxy,
# gke-labs/service-portals, Envoy, or a corporate secure web gateway).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: agents-net-egress
  namespace: agents-net-demo
spec:
  spec:
    devices:
      requests:
        - name: agents-net
          exactly:
            deviceClassName: dra.agents.net
            allocationMode: ExactCount
            count: 1
      config:
        - requests: ["agents-net"]
          opaque:
            driver: dra.agents.net
            parameters:
              apiVersion: dra.agents.net/v1alpha1
              kind: DriverConfig
              # Use PodNetworkIsolated on clusters with KEP-6313 Network-Isolated Pods,
              # or NetworkPolicyDenyAll on existing CNI clusters (combines route flushing
              # with default pure-netlink tc clsact NIC blocking from DeviceClass).
              confinementMode: NetworkPolicyDenyAll
              policyEnforcementPoint:
                url: https://pep.agents-net-demo.svc:8443
                tls:
                  serverName: pep.agents-net-demo.svc
                  caCertificateRefs:
                    - type: ConfigMap
                      configMapRef:
                        name: pep-ca
                        key: ca.crt
                auth:
                  type: ServiceAccountToken
                  serviceAccountToken:
                    audience: agents.net/upstream
                    mode: Node
              caTrust:
                mode: InjectEnv
                bundleMode: AppendSystemRoots
                sources:
                  - type: Secret
                    secretRef:
                      name: corp-ca-tls
                      key: ca.crt
              custom:
                tenant: team-alpha
                env: demo
