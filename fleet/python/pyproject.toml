[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-fleet-planner"
version = "0.0.1"
description = "Planner + trainer + fleetctl for the multi-cluster fleet PoC. See ../README.md."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "google-cloud-storage>=2.16",
  "pydantic>=2",
  "pyyaml>=6",
  # Kubernetes client — used by fleet-member for CustomObjectsApi (SDK doesn't
  # wrap SandboxTemplate/SandboxWarmPool CRUD).
  "kubernetes>=29",
  # Agent Sandbox SDK — used by fleet-member for claim listing and by the
  # stress test for the full claim lifecycle. Install
  # from the local sibling path so the PoC tracks the in-tree SDK version.
  "k8s-agent-sandbox",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fleetctl      = "agent_sandbox_fleet.cli:main"
fleet-member  = "agent_sandbox_fleet.fleet_member:main"
fleet-hubcheck = "agent_sandbox_fleet.hubcheck:main"

[tool.setuptools.packages.find]
include = ["agent_sandbox_fleet*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
