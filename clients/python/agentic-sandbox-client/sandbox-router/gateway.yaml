# A Gateway to create an endpoint for external HTTP traffic.
#
# The Gateway and HTTPRoute resources below are cloud-agnostic — only
# spec.gatewayClassName varies per environment. Pick the class that matches
# your cluster's Gateway API controller:
#
#   Istio (any cluster):          istio
#   GKE (managed L7 LB):         gke-l7-global-external-managed
#   KinD (local dev):             cloud-provider-kind
#   AWS ALB Controller:           amazon-vpc-lattice
#   Envoy Gateway:                eg
#
# The default below uses Istio, which works on any conformant Kubernetes cluster
# (managed or self-hosted). See README.md for installation instructions.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-http-gateway
  namespace: default
spec:
  gatewayClassName: istio # See comment above for alternatives
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
# The HTTPRoute to connect the Gateway to the router service.
# This resource is identical across all Gateway API implementations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sandbox-router-route
  namespace: default
spec:
  parentRefs:
  - name: external-http-gateway # This must match the name of the Gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sandbox-router-svc # Route all traffic to the router service
      port: 8080
---
# GKE-specific: HealthCheckPolicy tells the GKE Gateway to use the router app
# "/healthz" endpoint for its health checks instead of the default "/".
# Skip this resource on non-GKE clusters — most Gateway implementations use
# the HTTPRoute backend's readiness probe or their own health check defaults.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: router-health-check-policy
  namespace: default
spec:
  targetRef:
    group: ""
    kind: Service
    name: sandbox-router-svc # This must match the name of the router's service
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /healthz # Tell the health checker to use this path
