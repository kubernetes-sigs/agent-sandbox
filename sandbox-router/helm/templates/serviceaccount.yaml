apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-router
  namespace: {{ include "sandbox-router.namespace" . }}
  labels:
    {{- include "sandbox-router.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
