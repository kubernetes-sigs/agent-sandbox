# NetworkPolicy for the agent-sandbox-controller.
#
# The controller runs a metrics server (8080) and health probes (8081), and
# needs egress to the API server and DNS. Everything else is denied.
#
# Metrics ingress is open to all namespaces — downstream distributions can
# restrict to their monitoring namespace. Health probe ingress is open because
# kubelet probes come from the node, not from a pod.
#
# The API server typically runs on host-network control plane nodes, not as
# regular pods, so neither a namespaceSelector nor a podSelector matches it.
# The port-only rule (no "to" restriction) allows egress on the standard API
# ports to any destination. For strict egress compliance (SOC 2, FedRAMP, CIS
# benchmarks), tighten with an ipBlock targeting the API server endpoint
# addresses, not the ClusterIP of the kubernetes Service:
#   kubectl get endpointslice -n default \
#     -l kubernetes.io/service-name=kubernetes -o wide
# kube-proxy rewrites the ClusterIP to an endpoint address before the CNI
# evaluates this policy, so an ipBlock for the ClusterIP matches nothing and
# blocks all API traffic. A scoped rule must allow that endpoint port, not the
# Service port. Endpoint addresses change when control-plane nodes are
# replaced, so a CIDR for the control-plane subnet is easier to maintain than
# per-node /32 entries. On a CNI that evaluates policy before the rewrite, the
# ClusterIP is what matches; list both as peers to cover either dataplane.
#
# The podSelector uses the legacy label "app: agent-sandbox-controller" to
# match the existing controller Deployment. The sandbox-router uses the
# recommended app.kubernetes.io/name and app.kubernetes.io/component labels;
# a future release may align the controller labels with that convention.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controller
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox-controller
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # Metrics scrape — open to all namespaces by default.
  - ports:
    - protocol: TCP
      port: 8080   # Replace with 8443 when --metrics-secure-serving is enabled.
  # Kubelet health/readiness probes.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # DNS resolution. Port-only (no namespace restriction) because DNS
  # services may run outside kube-system on some distributions.
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Kubernetes API server — required for reconciliation and leader election.
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
