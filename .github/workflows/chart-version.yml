name: Chart Version

# presubmit-test-autogen-up-to-date runs this same check, but Prow holds
# presubmits for non-members until ok-to-test; this does not wait.

on:
  pull_request:
    paths:
      - "api/**"
      - "controllers/**"
      - "extensions/**"
      - "helm/**"
      - "codegen.go"
      - "dev/tools/verify-chart-version"

jobs:
  verify-chart-version:
    name: Verify Chart Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/checkout fetches only the PR ref, so origin/<base> is absent
      # even at fetch-depth: 0, and the merge-base lookup needs it.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Run chart version check
        run: dev/tools/verify-chart-version
