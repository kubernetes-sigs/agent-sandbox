# Generates the Python ProcessService stubs vendored into the Python SDK.
# Output lands under k8s_agent_sandbox/_proto/. The generated gRPC module
# imports its sibling as a top-level "process.v1" package, so callers import
# the stubs through k8s_agent_sandbox.commands._process_stubs, which puts
# _proto on sys.path (do not import k8s_agent_sandbox._proto.process.v1.*
# directly).
# Run via: buf generate --template buf.gen.python.yaml
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/python:v36.1
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
  - remote: buf.build/protocolbuffers/pyi:v36.1
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
  - remote: buf.build/grpc/python:v1.83.1
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
