# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**/*.instructions.md"

reviews:
  request_changes_workflow: true

  path_filters:
    - "!clients/k8s/**"
    - "!k8s/crds/**"
    - "!**/*_generated*.go"
    - "!**/zz_generated.*.go"
    - "!vendor/**"

  auto_review:
    base_branches:
      - ".*"
    labels:
      - "!needs-ok-to-test"
      - "!do-not-merge/work-in-progress"
      - "!cncf-cla: no"

