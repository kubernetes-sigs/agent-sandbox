apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: ci-runner-pool
spec:
  # Keep a few ready sandboxes so concurrent CI jobs claim instantly.
  # Scale this with your peak parallel job count; see ../hpa-swp-scaling
  # and ../keda-scale-to-zero for autoscaling the pool.
  replicas: 2
  sandboxTemplateRef:
    name: ci-runner-template
