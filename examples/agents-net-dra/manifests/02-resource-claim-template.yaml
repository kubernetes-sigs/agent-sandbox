#
# Namespace-scoped ResourceClaimTemplate referencing the cluster-admin
# DeviceClass "dra.agents.net-demo".
#
# When a Sandbox or SandboxTemplate Pod references this template via
# podTemplate.spec.resourceClaims[].resourceClaimTemplateName, Kubernetes
# kube-controller-manager creates one Pod-owned ResourceClaim per Pod and
# deletes it when the Sandbox is suspended or deleted.
#
# Namespace claims may only configure workload-local settings (caTrust from
# ConfigMap or ClusterTrustBundle, ingressPorts, and ExplicitProxy options).
# Confinement, adapterMode, PEP URL, mTLS auth, and attested custom attributes
# are locked to DeviceClass.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: agents-net-egress
  namespace: agents-net-demo
spec:
  spec:
    devices:
      requests:
        - name: agents-net
          exactly:
            deviceClassName: dra.agents.net-demo
            allocationMode: ExactCount
            count: 1
      config:
        - requests: ["agents-net"]
          opaque:
            driver: dra.agents.net
            parameters:
              apiVersion: dra.agents.net/v1alpha1
              kind: DriverConfig
              caTrust:
                mode: InjectEnv
                bundleMode: AppendSystemRoots
                sources:
                  - type: ConfigMap
                    configMapRef:
                      name: demo-ca
                      key: ca.crt
