# This NetworkPolicy allows cluster-wide ingress traffic to the controller's
# system ports: CRD conversion webhook (:9443), metrics (:8080), and kubelet probes (:8081).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: agent-sandbox-controller
    app.kubernetes.io/managed-by: kustomize
  name: allow-system-traffic
  namespace: agent-sandbox-system
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox-controller
  policyTypes:
    - Ingress
  ingress:
    # Allow cluster-wide access to CRD conversion webhook (:9443), metrics (:8080), and kubelet probes (:8081)
    - ports:
        - port: 9443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
