# SandboxTemplate running the sandboxd portable runtime daemon (KEP-539.2)
# as a sidecar next to an (unmodified) workload container. The two share the
# /workspace volume; the workload reaches sandboxd over pod loopback and
# discovers it via the SANDBOXD_* env vars.
#
# SDK access: sandboxd binds 127.0.0.1 only, so it is not reachable through
# the sandbox-router. External SDK clients use pod port-forward mode
# (Go: Runtime: RuntimeSandboxd; Python: SandboxdPodTunnelConnectionConfig).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandboxd-template
  namespace: default
spec:
  podTemplate:
    spec:
      # The sandbox runs untrusted agent code; it needs no API access.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Ensure the shared emptyDir is writable by the non-root runtime user.
        fsGroup: 1000
      containers:
        - name: sandboxd
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:latest-main
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080  # REST filesystem + probes
            - containerPort: 9090  # gRPC ProcessService
          # NOTE: a kubelet httpGet probe dials the pod IP, which cannot
          # reach sandboxd's loopback-only listeners, so /v1/health is not
          # usable as an httpGet probe today. Use an exec probe (runs inside
          # the container) until sandboxd supports a non-loopback bind.
          readinessProbe:
            exec:
              command: ["/usr/local/bin/sandboxd", "-version"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        - name: workload
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          env:
            - name: SANDBOXD_GRPC_ADDR
              value: "localhost:9090"
            - name: SANDBOXD_REST_ADDR
              value: "localhost:8080"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
