apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: irsa-sim-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:3.8
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "sts"
        readinessProbe:
          httpGet:
            path: /_localstack/health
            port: 4566
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: irsa-sim-ns
spec:
  selector:
    app: localstack
  ports:
  - port: 4566
    targetPort: 4566
