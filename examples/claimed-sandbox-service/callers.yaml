apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  labels:
    app.kubernetes.io/name: claimed-sandbox-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [pause]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
---
