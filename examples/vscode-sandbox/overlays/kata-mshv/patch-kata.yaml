# Patch individual fields so the Sandbox's container list stays intact.
- op: add
  path: /spec/podTemplate/spec/runtimeClassName
  value: kata-vm-isolation
# AKS sizes the guest VM from the memory limit. Envbuilder needs room to build.
- op: replace
  path: /spec/podTemplate/spec/containers/0/resources/requests/memory
  value: 4Gi
- op: add
  path: /spec/podTemplate/spec/containers/0/resources/limits/memory
  value: 4Gi
