{{- if .Values.pdb.enabled }}
# Prevent voluntary disruptions (drain, autoscaler eviction) from taking the
# entire router fleet offline. With N replicas, minAvailable: max(1, N-1) keeps
# you served during single-node events while still allowing node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-router
  namespace: {{ include "sandbox-router.namespace" . }}
  labels:
    {{- include "sandbox-router.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "sandbox-router.selectorLabels" . | nindent 6 }}
{{- end }}
