# This Secret contains a deliberately non-functional value for the offline demo.
# Never replace it with a real credential in source control. See README.md for
# provisioning a real key out of band.
apiVersion: v1
kind: Secret
metadata:
  name: nono-demo-llm-credential
type: Opaque
stringData:
  OPENAI_API_KEY: nono-demo-placeholder-not-a-real-api-key
  # Local Loki has authentication disabled. This placeholder activates the same
  # brokered bearer-token route a production authentication gateway would use;
  # it is never exposed directly to the agent or LogCLI process.
  LOKI_TOKEN: nono-demo-loki-placeholder-not-a-real-token
