# Default NetworkPolicy for the sandbox-router.
#
# Ingress is open to all namespaces on the proxy port because the router is the
# entry point for sandbox traffic — clients, SDKs, and Gateway controllers can
# live in any namespace. --authz-mode defaults to allow-all and the OLM
# deployment does not override it, so the default install has no L4 or L7
# authorization layer restricting access. To harden:
#   1. Set --authz-mode=tokenreview (or scoped-token) for L7 authz, and/or
#   2. Tighten the from: namespaceSelector to a known set of caller namespaces.
#
# Limitations and workarounds:
#
#   namespaceSelector: {} only matches sources on the pod network.
#   Host-network callers and L7 load balancers that send directly to pod IPs
#   are not matched by any namespaceSelector — they need an ipBlock rule.
#
#   Metrics scraping is restricted to the "monitoring" namespace. If your
#   Prometheus runs elsewhere, you need an extra policy for its namespace.
#
#   OLM-managed installs cannot edit this policy directly (the operator owns
#   it), but NetworkPolicies are additive — if *any* policy in the namespace
#   allows the traffic, it is allowed. Deploy a second NetworkPolicy to cover
#   additional sources.
#
# Egress to sandbox pods is unrestricted on port because the upstream port is
# caller-specified (X-Sandbox-Port header, default 8888). Destinations are
# limited to pods carrying the controller-stamped
# agents.x-k8s.io/sandbox-name-hash label (the same selector the router cache
# uses). Tighten namespaceSelector further if your tenancy model constrains
# valid targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # Proxy traffic — open to all namespaces; see header comment.
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    # Uncomment when TLS is enabled:
    # - protocol: TCP
    #   port: 8443
  # Metrics scrape — restrict to your monitoring namespace.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Kubelet probes hit the pod IP directly; allow all sources.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # DNS for resolving sandbox FQDNs. Port-only (no namespace restriction)
  # because DNS services may run outside kube-system on some distributions.
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Forward traffic to sandbox pods. The upstream port is caller-specified
  # (X-Sandbox-Port header, default 8888; sandboxd gRPC listens on 9090) so
  # the port is unrestricted. Destinations are limited to pods that carry
  # agents.x-k8s.io/sandbox-name-hash (stamped by the controller on every
  # sandbox pod) so a compromised router cannot reach arbitrary cluster
  # workloads. Sandboxes can live in any namespace.
  - to:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: agents.x-k8s.io/sandbox-name-hash
          operator: Exists
    ports:
    - protocol: TCP
  # OTel collector (if --enable-tracing or --enable-otel-metrics). Tighten
  # to your collector's namespace/pod selector.
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 4317
  # Kubernetes API server — required when --cache-enabled or
  # --authz-mode=tokenreview. The API server typically runs on host-network
  # control plane nodes, not as regular pods, so neither a namespaceSelector
  # nor a podSelector matches it. This port-only rule (no "to" restriction)
  # allows egress on the standard API ports to any destination.
  #
  # To restrict the destination, target the API server endpoint addresses, not
  # the ClusterIP of the kubernetes Service. kube-proxy rewrites the ClusterIP
  # to an endpoint address before the CNI evaluates this policy, so an ipBlock
  # for the ClusterIP matches nothing and blocks all API traffic; the router
  # then cannot reach the API server and its informer cache never syncs. Read
  # the endpoint addresses and port with:
  #   kubectl get endpointslice -n default \
  #     -l kubernetes.io/service-name=kubernetes -o wide
  # A scoped rule must allow that endpoint port, not the Service port.
  # Endpoint addresses change when control-plane nodes are replaced, so a CIDR
  # for the control-plane subnet is easier to maintain than per-node /32
  # entries. On a CNI that evaluates policy before the rewrite, the ClusterIP
  # is what matches; list both as peers to cover either dataplane.
  #
  # Skip this rule only when running with --cache-enabled=false AND
  # --authz-mode=allow-all.
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
