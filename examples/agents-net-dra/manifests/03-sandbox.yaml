#
# Unmodified agent-sandbox Sandbox attaching dra.agents.net solely through
# podTemplate.spec.resourceClaims[].resourceClaimTemplateName.
#
# Under HostTun (default), the Pod runs completely unprivileged with no sidecar
# container, no /dev/net/tun device, no egress.sock mount, and no HTTP_PROXY
# environment variables, while unmodified TCP, UDP, and DNS clients route
# transparently through the mTLS PEP.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: coding-agent
  namespace: agents-net-demo
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      resourceClaims:
        - name: agents-net
          resourceClaimTemplateName: agents-net-egress
      containers:
        - name: agent
          image: python:3.14-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - "import os, signal, time; signal.signal(signal.SIGTERM, lambda *_: os._exit(0)); time.sleep(3600)"
          resources:
            claims:
              - name: agents-net
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
