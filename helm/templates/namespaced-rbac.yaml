{{- if .Values.controller.watchNamespaces }}
{{- $controllerNs := include "agent-sandbox.namespace" . }}
{{- $inWatchList := false }}
{{- range .Values.controller.watchNamespaces }}
{{- if eq . $controllerNs }}
{{- $inWatchList = true }}
{{- end }}
{{- end }}
{{- if $inWatchList }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-controller
  namespace: {{ $controllerNs }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
{{ .Files.Get "files/rbac.namespaced.generated.yaml" | indent 0 }}
{{- if .Values.controller.extensions }}
{{ .Files.Get "files/extensions-rbac.namespaced.generated.yaml" | indent 0 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-controller
  namespace: {{ $controllerNs }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: {{ $controllerNs }}
roleRef:
  kind: Role
  name: agent-sandbox-controller
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
