# Path 1 (kubectl): a plain Sandbox. Run prompts with:
#   kubectl exec pod/opencode-sandbox -- opencode run "your prompt"
# Start the interactive OpenCode TUI with:
#   kubectl exec -it pod/opencode-sandbox -- opencode
# All Secret keys are optional: without the opencode-api-keys Secret,
# OpenCode uses its free default model.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: opencode-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: opencode-sandbox
    spec:
      automountServiceAccountToken: false
      # Makes the PVC-backed dirs group-writable for UID 1000.
      securityContext:
        fsGroup: 1000
      containers:
        - name: opencode
          image: opencode-sandbox:v1
          imagePullPolicy: IfNotPresent
          # Keep stdin and a TTY so `kubectl exec -it` can run the OpenCode TUI.
          stdin: true
          tty: true
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-api-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-api-keys
                  key: OPENCODE_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: opencode-state
              mountPath: /home/python/.local/share/opencode
  volumeClaimTemplates:
    - metadata:
        name: workspace
        labels:
          sandbox: opencode-sandbox
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: opencode-state
        labels:
          sandbox: opencode-sandbox
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
