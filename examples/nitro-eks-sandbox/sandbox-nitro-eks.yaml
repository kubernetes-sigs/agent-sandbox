apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: vscode-nitro
spec:
  podTemplate:
    spec:
      # EKS Auto Mode ships this RuntimeClass. A pod that names it runs in its
      # own AWS Nitro Sandbox, a lightweight VM with its own kernel, on a node
      # that Auto Mode launches for it. No other field changes.
      runtimeClassName: isolated-sandbox
      containers:
      - name: code-server
        # The image runs as a non-root user and serves VS Code on port 8080,
        # with a generated password in ~/.config/code-server/config.yaml.
        image: codercom/code-server:4.145.2
        securityContext:
          runAsNonRoot: true
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
