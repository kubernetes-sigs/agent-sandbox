# Generates the Python ProcessService stubs vendored into the Python SDK.
# Output lands in k8s_agent_sandbox/_proto/<proto-package-path>, so the
# generated modules import as k8s_agent_sandbox._proto.process.v1.*.
# Run via: buf generate --template buf.gen.python.yaml
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/python
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
  - remote: buf.build/protocolbuffers/pyi
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
  - remote: buf.build/grpc/python
    out: ../../../clients/python/agentic-sandbox-client/k8s_agent_sandbox/_proto
