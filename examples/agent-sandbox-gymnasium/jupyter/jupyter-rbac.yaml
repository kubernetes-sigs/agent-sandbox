---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter-sandbox-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyter-sandbox-role
  namespace: default
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyter-sandbox-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: jupyter-sandbox-sa
    namespace: default
roleRef:
  kind: Role
  name: jupyter-sandbox-role
  apiGroup: rbac.authorization.k8s.io
