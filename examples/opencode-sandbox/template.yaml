# Path 2 (Python SDK): SandboxTemplate for the opencode-pool warm pool.
# The runtime serves the SDK data plane on :8888; run_opencode.py claims a
# warm sandbox and drives `opencode run` through sandbox.commands.run().
# All Secret keys are optional: without the opencode-api-keys Secret,
# OpenCode uses its free default model.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: opencode-template
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      # Makes the PVC-backed dirs group-writable for UID 1000.
      securityContext:
        fsGroup: 1000
      containers:
      - name: opencode
        image: opencode-sandbox:v1
        # kind-local image; for real clusters push to a registry (see README).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: "/"
            port: 8888
        livenessProbe:
          httpGet:
            path: "/"
            port: 8888
          initialDelaySeconds: 2
          periodSeconds: 10
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-api-keys
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENCODE_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-api-keys
              key: OPENCODE_API_KEY
              optional: true
        - name: OPENCODE_MODEL
          valueFrom:
            secretKeyRef:
              name: opencode-api-keys
              key: OPENCODE_MODEL
              optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "2Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: opencode-state
          mountPath: /home/python/.local/share/opencode
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
  - metadata:
      name: opencode-state
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
