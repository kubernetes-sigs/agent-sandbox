# Warm pool backing main.py: the SDK creates SandboxClaims against this pool.
# replicas: 1 keeps one pre-warmed pod; a claim arriving on an empty pool
# cold-starts (pod create + image pull), bounded by the SDK's
# sandbox_ready_timeout.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: deepagents-warmpool
  namespace: default
spec:
  # Recreate (instead of the OnReplenish default) so template edits during
  # development replace warm sandboxes immediately rather than lingering.
  updateStrategy:
    type: Recreate
  replicas: 1
  sandboxTemplateRef:
    name: deepagents-template
