apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- vscode-sandbox.yaml

configMapGenerator:
- name: vscode-sandbox-entrypoint
  files:
  - entrypoint.sh
  options:
    # Kustomize does not rewrite ConfigMap references inside Sandbox pod templates.
    disableNameSuffixHash: true
