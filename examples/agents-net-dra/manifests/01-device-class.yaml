#
# Cluster-admin DeviceClass defining the confinement mode, HostTun adapter
# (default, zero sidecar), mandatory mTLS Policy Enforcement Point (PEP), and
# admin-attested custom attributes.
#
# dra-agents-net restricts these fields strictly to DeviceClass (FromClass) so
# namespace workloads cannot bypass the PEP, disable confinement, or spoof
# Agents-Net-Attributes headers from a ResourceClaim.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.agents.net-demo
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.agents.net"
  config:
    - opaque:
        driver: dra.agents.net
        parameters:
          apiVersion: dra.agents.net/v1alpha1
          kind: DriverConfig
          # NetworkPolicyDenyAll keeps a CNI Pod IP so unmodified agent-sandbox
          # Sandbox Ready=True and SandboxWarmPool adoption work today.
          confinementMode: NetworkPolicyDenyAll
          # DropAll flushes eth0 routes and attaches tc clsact drop filters on
          # eth0. Set nicBlockMode: Disabled with a CNI NetworkPolicy if you
          # route inbound traffic to PodIP:8888 via sandbox-router; HostTun
          # installs source-IP policy routing so eth0 replies keep working.
          nicBlockMode: DropAll
          # HostTun (default) creates tun0 inside the Pod netns and runs the
          # userspace TCP/IP stack + VirtualDNS (198.18.0.0/15) on the host.
          # Zero sidecar container, zero Pod privileges, transparent TCP/UDP.
          adapterMode: HostTun
          policyEnforcementPoint:
            url: https://connect-proxy.agents-net-demo.svc.cluster.local:8443
            tls:
              serverName: connect-proxy.agents-net-demo.svc.cluster.local
              caCertificateRefs:
                - type: HostPath
                  hostPath: /etc/dra-agents-net/ca/ca.crt
            auth:
              type: MTLS
              mtls:
                certDir: /etc/dra-agents-net/client
          custom:
            tenant: team-alpha
            env: demo
