# SandboxTemplate for the bma-runner-pool warm pool. Each pod runs the
# managed-agents runner daemon on :8080; the controller claims one sandbox
# per BMA session and starts the session's executor (codex exec-server) in
# it over a port-forward. The executor attaches outbound to BMA with AWS
# SigV4, so sandbox pods need HTTPS and WebSocket egress to
# bedrock-mantle.<region>.api.aws.
#
# The bma-env-key Secret is required: the executor signs with the pod-side
# AWS credentials (a restricted identity; see the bridge README). The
# controller-side credential (BMA API access + iam:PassRole) stays in the
# controller process and must never be injected here — agent-generated code
# inside the sandbox can read its environment.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: bma-runner-template
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      # Makes the PVC-backed workspace group-writable for UID 1000.
      securityContext:
        fsGroup: 1000
      containers:
      - name: runner
        image: bma-runner:v1
        # kind-local image; for real clusters push to a registry (see README).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: bma-env-key
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bma-env-key
              key: AWS_SECRET_ACCESS_KEY
        # Temporary credentials are optional; the Secret may omit the key.
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: bma-env-key
              key: AWS_SESSION_TOKEN
              optional: true
        - name: AWS_REGION
          value: us-east-1
        - name: BMA_ENDPOINT
          value: https://bedrock-mantle.us-east-1.api.aws
        - name: RUNNER_EXEC_BIN
          value: codex
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "2Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
  # The workspace PVC is retained across suspend/resume, so a session's
  # files survive suspension even though the pod does not.
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
