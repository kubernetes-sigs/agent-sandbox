apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: rllib-sandboxd-template
  namespace: rllib-sandbox-example
spec:
  service: true
  networkPolicy:
    # A podSelector without a namespaceSelector admits only this namespace.
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/part-of: rllib-sandbox-example
        ports:
          - protocol: TCP
            port: 8080
          - protocol: TCP
            port: 9090
    egress: []
  podTemplate:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: sandboxd
          # Replace with the fixed-source sandboxd image built in the README.
          image: REPLACE_WITH_YOUR_SANDBOXD_IMAGE
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: rllib-sandboxd-warmpool
  namespace: rllib-sandbox-example
spec:
  replicas: 2
  sandboxTemplateRef:
    name: rllib-sandboxd-template
