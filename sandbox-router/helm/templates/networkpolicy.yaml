{{- if .Values.networkPolicy.enabled }}
# Egress is intentionally broad because the router dials arbitrary sandbox pods
# in tenant namespaces: narrow it if your tenancy model constrains which
# namespaces are valid targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: {{ include "sandbox-router.namespace" . }}
  labels:
    {{- include "sandbox-router.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sandbox-router.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # Proxy traffic.
  - from:
    {{- toYaml .Values.networkPolicy.proxyIngressFrom | nindent 4 }}
    ports:
    - protocol: TCP
      port: 8080
    {{- if .Values.tls.enabled }}
    - protocol: TCP
      port: 8443
    {{- end }}
  # Metrics scrape.
  - from:
    {{- toYaml .Values.networkPolicy.metricsIngressFrom | nindent 4 }}
    ports:
    - protocol: TCP
      port: 9090
  # Kubelet probes hit the pod IP directly.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # DNS for resolving sandbox FQDNs.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Forwarding to sandbox pods on the agreed sandbox port.
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8888
  # OTel collector (if tracing or OTel metrics are enabled).
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 4317
  # Kubernetes API server, required by the Pod-IP cache and by
  # --authz-mode=tokenreview. NetworkPolicy cannot name the apiserver, so this
  # allows the default namespace on the standard ports. Add an ipBlock for the
  # LB CIDR if your cluster routes apiserver traffic that way.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
{{- end }}
