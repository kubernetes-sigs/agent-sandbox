{{- if .Values.controller.enableAutoSuspendAndResume }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sandbox-router-to-controller-suspension-api
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-sandbox.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  # Restrict unauthenticated suspension API (:8090) exclusively to sandbox-router pods
  - from:
    - podSelector:
        matchLabels:
          app: sandbox-router
    ports:
    - protocol: TCP
      port: 8090
{{- end }}
