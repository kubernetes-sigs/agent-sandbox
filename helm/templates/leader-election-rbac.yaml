{{- if and .Values.controller.watchNamespaces (hasKey .Values.controller "leaderElect") .Values.controller.leaderElect }}
{{- $leNs := include "agent-sandbox.leaderElectionNamespace" . }}
{{- $alreadyCovered := false }}
{{- range .Values.controller.watchNamespaces }}
{{- if eq . $leNs }}
{{- $alreadyCovered = true }}
{{- end }}
{{- end }}
{{- if not $alreadyCovered }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-controller-leader-election
  namespace: {{ $leNs }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-controller-leader-election
  namespace: {{ $leNs }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: {{ include "agent-sandbox.namespace" . }}
roleRef:
  kind: Role
  name: agent-sandbox-controller-leader-election
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
