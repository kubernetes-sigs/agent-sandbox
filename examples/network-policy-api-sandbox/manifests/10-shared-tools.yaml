# Stand-in for an in-cluster service an agent might call (MCP server, model
# gateway, ...). agnhost netexec answers GET /hostname on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-server
  namespace: shared-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-server
  template:
    metadata:
      labels:
        app: tool-server
    spec:
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tool-server
  namespace: shared-tools
spec:
  selector:
    app: tool-server
  ports:
    - port: 8080
      targetPort: 8080
