name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - "v*"
  # Exercise test and build before a release tag does. publish-to-pypi is
  # skipped for non-push events.
  pull_request:
    paths:
      - ".github/workflows/pypi-publish.yml"
      - "clients/python/agentic-sandbox-client/pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests 🧪
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: clients/python/agentic-sandbox-client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Important: Fetches all history and tags for setuptools-scm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies (including tests)
        run: python3 -m pip install ".[test]"

      - name: Run Unit Tests
        run: python3 -m pytest

  build:
    name: Build distribution 📦
    needs: test

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python/agentic-sandbox-client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history and tags for setuptools-scm during build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pypa/build and twine
        run: >-
          python3 -m pip install build==1.4.3 twine==6.2.0

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Check distribution packages
        run: python3 -m twine check dist/*

      # Trusted publishing cannot create a new PyPI project, so an upload for
      # an unregistered distribution fails at release time and aborts the whole
      # upload. Catch that here instead.
      - name: Verify every distribution is a registered PyPI project
        run: |
          for whl in dist/*.whl; do
            name="$(basename "$whl" | cut -d- -f1)"
            if ! code="$(curl -sSL --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${name}/json")"; then
              echo "::error::Could not verify ${name} on PyPI after retries; refusing to continue."
              exit 1
            fi
            if [ "$code" = "404" ]; then
              echo "::error::${name} is not a PyPI project. Register it with a Trusted Publisher before adding it to this workflow."
              exit 1
            elif [ "$code" != "200" ]; then
              echo "::error::PyPI returned HTTP ${code} while verifying ${name}; refusing to continue."
              exit 1
            fi
          done

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: clients/python/agentic-sandbox-client/dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/k8s-agent-sandbox
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: read

    # Run if it is a push event
    if: >-
      (github.event_name == 'push')

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
