apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: secure-template
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        # warmpool-pdb.yaml selects idle warm pool pods by this label.
        app: my-sandbox-app
    spec:
      containers:
      - name: debug-container
        image: nginx:alpine
