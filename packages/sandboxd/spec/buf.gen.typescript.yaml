# Generates the TypeScript ProcessService stubs vendored into the TS SDK.
# Output lands under src/_proto/. Depends on @bufbuild/protobuf, which the
# SDK declares only as an optional peer dependency; callers import the
# stubs directly from src/_proto/process/v1/process_pb (see the README
# committed alongside the generated output for details).
# Run via: buf generate --template buf.gen.typescript.yaml
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/bufbuild/es:v2.14.1
    out: ../../../clients/typescript/agentic-sandbox-client/src/_proto
    opt: target=ts
