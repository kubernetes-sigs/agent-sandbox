# Applied only after the Sandbox has stopped and finalized its signed audit.
# This pod mounts the retained state read-only so `nono audit verify` can check
# it against the public key generated by run-test-kind.sh.
apiVersion: v1
kind: Pod
metadata:
  name: nono-audit-verifier
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  containers:
    - name: verifier
      image: ghcr.io/example/nono-agent-runtime:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args: ["sleep 300"]
      env:
        - name: XDG_STATE_HOME
          value: /var/lib/nono-state
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: audit-state
          mountPath: /var/lib/nono-state
          readOnly: true
        - name: audit-public-key
          mountPath: /etc/nono/audit-public-key
          readOnly: true
  volumes:
    - name: audit-state
      persistentVolumeClaim:
        claimName: nono-demo-audit
        readOnly: true
    - name: audit-public-key
      configMap:
        name: nono-demo-audit-public-key
