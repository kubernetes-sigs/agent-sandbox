# DeerFlow sandbox runtime: stock python:3.11 with the sandboxd binary
# injected by an initContainer (topology B from examples/sandboxd-sandbox).
# DeerFlow tools execute python3/shell inside THIS container, and its
# filesystem tools (read/write/list/glob/grep) resolve under sandboxd's
# --root-dir=/mnt/user-data, matching DeerFlow's conventional workspace path
# /mnt/user-data/workspace.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: deer-flow-template
  namespace: default
spec:
  podTemplate:
    spec:
      # The sandbox runs untrusted agent code; it needs no API access.
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: install-sandboxd
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:latest-main
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp /usr/local/bin/sandboxd /sandboxd-bin/sandboxd"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sandboxd-bin
              mountPath: /sandboxd-bin
      containers:
        - name: app
          image: python:3.11
          imagePullPolicy: IfNotPresent
          command:
            - /sandboxd-bin/sandboxd
            - --root-dir=/mnt/user-data
            - --rest-port=8080
            - --grpc-port=9090
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080  # REST filesystem + probes
            - containerPort: 9090  # gRPC ProcessService
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
          volumeMounts:
            # Read-only: sandboxed commands must not replace the injected binary.
            - name: sandboxd-bin
              mountPath: /sandboxd-bin
              readOnly: true
            - name: workspace
              # Mount the writable emptyDir AT sandboxd's --root-dir itself.
              # Mounting a subdir instead would leave /mnt/user-data a
              # runtime-created, root-owned (0755) parent that the uid-1000
              # sandbox cannot write: DeerFlow's outputs/ and uploads/
              # siblings of workspace/ would fail EACCES. With the volume on
              # the root, fsGroup 1000 governs it and the usual
              # /mnt/user-data/{workspace,uploads,outputs} subdirs are all
              # creatable (sandboxd also creates parents on file writes).
              mountPath: /mnt/user-data
      volumes:
        - name: sandboxd-bin
          emptyDir: {}
        - name: workspace
          emptyDir: {}
