{{- if .Values.metrics.prometheusRule.enabled }}
{{- $namespace := include "agent-sandbox.namespace" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-sandbox-controller
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: agent-sandbox-controller.rules
      rules:
        - alert: AgentSandboxControllerMetricsTargetsDown
          expr: |
            absent(up{namespace="{{ $namespace }}", service="agent-sandbox-controller"}) or
            max by (namespace, service) (up{namespace="{{ $namespace }}", service="agent-sandbox-controller"}) < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Agent Sandbox controller metrics targets are down
            description: Prometheus has been unable to scrape any agent-sandbox-controller metrics target for 5 minutes.
    {{- with .Values.metrics.prometheusRule.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
