# A Sandbox that runs its workload through `nono run`, giving in-pod least
# privilege on top of the pod-level isolation provided by runtimeClassName.
#
# Conventions mirror examples/openclaw-gvisor-sandbox: non-root, drop ALL caps,
# no service-account token, PVC-backed /workspace.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: nono-agent
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: nono-agent
      # Phase 3 convention: the image reads this to pick a profile. The controller
      # does not interpret it.
      annotations:
        agents.x-k8s.io/nono-profile: agent
    spec:
      # The demo exits once run-test-kind.sh writes its finish sentinel so nono
      # can finalize the signed audit. Do not restart it and create a second
      # session before the verifier mounts the audit PVC.
      restartPolicy: Never
      # Runtime class controls the OUTER (pod) isolation boundary. nono's filesystem
      # enforcement needs Landlock in the kernel the process runs against:
      #   - default runtime (omitted below): works if the NODE kernel has Landlock
      #     (Linux >= 5.13 with landlock in the active LSM list). This is what the
      #     kind demo uses so enforcement is actually observable.
      #   - runtimeClassName: kata-qemu -> works if the GUEST kernel enables
      #     Landlock. Use `kubectl apply -k .` to select it.
      #   - runtimeClassName: gvisor -> blocked today (Sentry lacks the Landlock
      #     syscalls, https://github.com/google/gvisor/issues/13439); nono FAILS
      #     CLOSED there rather than running unsandboxed.
      # In production, combine a strong runtime class with nono for defense in depth.
      # runtimeClassName: gvisor   # enable once #13439 lands
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: agent
          image: ghcr.io/example/nono-agent-runtime:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ENTRYPOINT is `nono`; these args select the profile and the workload.
          args:
            - run
            - --profile
            - /etc/nono/profiles/agent.json
            - --audit-integrity
            - --audit-sign-key
            - file:///etc/nono/audit-signing/private.pk8.b64
            - --
            - python3
            - /opt/agent/workload.py
          # The bundled Secret contains a non-functional placeholder so the offline
          # demo can exercise credential brokering without a startup warning. For a
          # real workload, provision this Secret out of band; never commit the key.
          # nono resolves the real value in the supervisor and exposes only a
          # session-scoped phantom token to the agent process.
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nono-demo-llm-credential
                  key: OPENAI_API_KEY
            # The workload reports expected denials as successful policy checks;
            # keep duplicate proxy warnings out of the normal demo output.
            - name: RUST_LOG
              value: nono_proxy::tls_intercept::handle=error,nono_proxy::reverse=error
            # Audit state is written by the trusted supervisor to a dedicated PVC
            # outside the agent profile's filesystem grants.
            - name: XDG_STATE_HOME
              value: /var/lib/nono-state
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: nono-profiles
              mountPath: /etc/nono/profiles
              readOnly: true
            # Deliberately mounted but NOT granted in the profile: the agent must
            # not be able to read it. Landlock enforces that.
            - name: secret-config
              mountPath: /etc/secret-config
              readOnly: true
            - name: audit-state
              mountPath: /var/lib/nono-state
            # Generated by run-test-kind.sh. The supervisor loads this before
            # sandbox activation; the agent has no filesystem grant for it.
            - name: audit-signing-key
              mountPath: /etc/nono/audit-signing
              readOnly: true
            # Source credential for the command-scoped Loki proxy route. The
            # supervisor resolves it before sandbox activation; /etc/nono is not
            # granted to the agent or LogCLI child.
            - name: loki-credential
              mountPath: /etc/nono/loki-credential
              readOnly: true
            # Trust anchor for nono's TLS connection to the demo Loki Service.
            # The private key is mounted only into the Loki pod.
            - name: loki-tls-ca
              mountPath: /etc/nono/loki-tls
              readOnly: true
      volumes:
        - name: nono-profiles
          configMap:
            name: nono-agent-profiles
        - name: secret-config
          configMap:
            name: secret-config-demo
        - name: audit-state
          persistentVolumeClaim:
            claimName: nono-demo-audit
        - name: audit-signing-key
          secret:
            secretName: nono-demo-audit-signing-key
            defaultMode: 0440
        - name: loki-credential
          secret:
            secretName: nono-demo-llm-credential
            items:
              - key: LOKI_TOKEN
                path: token
            defaultMode: 0440
        - name: loki-tls-ca
          secret:
            secretName: nono-demo-loki-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
