apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: claude-code-template
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      # Ensures the PVC-backed dirs are group-writable for UID 1000.
      securityContext:
        fsGroup: 1000
      containers:
      - name: claude-code
        image: claude-code-sandbox:v1
        # kind-local image; for real clusters push to a registry and switch
        # this to IfNotPresent (see README).
        imagePullPolicy: Never
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: "/"
            port: 8888
        livenessProbe:
          httpGet:
            path: "/"
            port: 8888
          initialDelaySeconds: 2
          periodSeconds: 10
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: claude-code-api-keys
              key: ANTHROPIC_API_KEY
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            secretKeyRef:
              name: claude-code-api-keys
              key: ANTHROPIC_BASE_URL
              optional: true
        - name: ANTHROPIC_MODEL
          valueFrom:
            secretKeyRef:
              name: claude-code-api-keys
              key: ANTHROPIC_MODEL
              optional: true
        # Recommended marker for Claude Code running inside a container.
        - name: IS_SANDBOX
          value: "1"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "2Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: claude-state
          mountPath: /home/python/.claude
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
  - metadata:
      name: claude-state
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
