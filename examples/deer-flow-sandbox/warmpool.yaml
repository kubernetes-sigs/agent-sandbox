# Warm pool backing AgentSandboxProvider.acquire(): the SDK creates
# SandboxClaims against this pool. replicas: 1 keeps one pre-warmed pod;
# claims arriving on an empty pool cold-start (pod create + image pull),
# bounded by DeerFlow's sandbox.ready_timeout.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: deer-flow-warmpool
  namespace: default
spec:
  updateStrategy:
    type: Recreate
  replicas: 1
  sandboxTemplateRef:
    name: deer-flow-template
