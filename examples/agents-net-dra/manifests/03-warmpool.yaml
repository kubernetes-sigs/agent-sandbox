# SandboxTemplate + SandboxWarmPool + SandboxClaim using standard Kubernetes DRA
# ResourceClaimTemplateName. Each warm replica receives its own Pod-owned
# ResourceClaim from kube-controller-manager, and dra-agents-net automatically
# propagates agents.x-k8s.io/claim-uid and agents.x-k8s.io/claim-name to the PEP
# as soon as a SandboxClaim adopts a warm Pod.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agent-template
  namespace: agents-net-demo
spec:
  # Optional: dra-agents-net's default tc clsact nicBlockMode=DropAll isolates all
  # non-loopback NICs independently of NetworkPolicy. Leave Managed (default) or
  # provide an explicit deny-all NetworkPolicy if you also want CNI-level rules.
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      resourceClaims:
        - name: agents-net
          resourceClaimTemplateName: agents-net-egress
      containers:
        - name: agent
          image: python:3.14-slim
          command:
            - python3
            - -c
            - "import os, signal, time; signal.signal(signal.SIGTERM, lambda *_: os._exit(0)); time.sleep(3600)"
          resources:
            claims:
              - name: agents-net
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: agent-pool
  namespace: agents-net-demo
spec:
  replicas: 2
  sandboxTemplateRef:
    name: agent-template
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: coding-session
  namespace: agents-net-demo
spec:
  warmPoolRef:
    name: agent-pool
