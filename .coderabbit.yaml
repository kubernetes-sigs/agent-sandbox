# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - files: ".github/instructions/controllers.instructions.md"
        applyTo: "controllers/**/*.go,extensions/controllers/**/*.go,internal/**/*.go"
      - files: ".github/instructions/api.instructions.md"
        applyTo: "api/**/*.go,extensions/api/**/*.go"
      - files: ".github/instructions/python-sdk.instructions.md"
        applyTo: "clients/python/**/*"
      - files: ".github/instructions/go-sdk.instructions.md"
        applyTo: "clients/go/**/*"
      - files: ".github/instructions/docs.instructions.md"
        applyTo: "docs/**/*,site/**/*,README.md,CONTRIBUTING.md"

reviews:
  request_changes_workflow: true

  path_filters:
    - "!clients/k8s/**"
    - "!k8s/crds/**"
    - "!**/*_generated*.go"
    - "!**/zz_generated.*.go"
    - "!vendor/**"

  auto_review:
    base_branches:
      - ".*"
    labels:
      - "!needs-ok-to-test"
      - "!do-not-merge/work-in-progress"
      - "!cncf-cla: no"

