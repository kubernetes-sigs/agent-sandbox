openapi: "3.0.3"
info:
  title: sandboxd Filesystem & Runtime REST API
  description: >
    Stateless REST interface for sandbox file system operations and runtime metadata.
    Part of the Agent Runtime Protocol hybrid gRPC/REST architecture defined in KEP-539.2.
    High-performance raw file transfers (read/write) are served over HTTP REST, while interactive
    process execution is served over gRPC on a dedicated port.
    Compatibility & Migration Note: This specification replaces the unversioned python-runtime
    endpoints (/upload, /download, /list, /exists) and FileEntry wire representation. Supported
    SDK clients select this versioned /v1/ surface explicitly; they do not auto-detect the runtime
    from environment variables. See KEP-539.2 for the endpoint and wire-format differences.
    Security note: sandboxd listens on the pod network by default. Protect both runtime ports with
    pod isolation and NetworkPolicy, or bind to loopback for local-only access. Never expose the
    runtime API directly to an untrusted public network. When sandboxd runs with --auth-token-sha256 or --auth-token-file,
    every request except GET /v1/health must carry "Authorization: Bearer <token>"; otherwise it
    is refused with 401 UNAUTHENTICATED.
  version: "v1"

security:
  - {}
  - bearerAuth: []

servers:
  - url: http://localhost:8080/v1
    description: sandboxd REST server (default port 8080; listen address is configurable)

paths:
  /files/{path}:
    parameters:
      - $ref: "#/components/parameters/FilePath"

    get:
      summary: Read a file or list a directory
      description: >
        If the path points to a file, returns raw file bytes (application/octet-stream).
        If the path points to a directory, returns a structured directory listing (application/json).
        Pass type to fail with 409 instead when the path is not of the expected kind.
        Pass recursive=true to also list nested directories.
      parameters:
        - $ref: "#/components/parameters/ExpectedType"
        - $ref: "#/components/parameters/ListRecursive"
        - $ref: "#/components/parameters/ListMaxDepth"
      responses:
        "200":
          description: File contents or directory listing
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    head:
      summary: Check whether a file or directory exists
      description: Returns the same status and metadata headers as GET without a response body.
      parameters:
        - $ref: "#/components/parameters/ExpectedType"
        - $ref: "#/components/parameters/ListRecursive"
        - $ref: "#/components/parameters/ListMaxDepth"
      responses:
        "200":
          description: Path exists
        "400":
          description: >
            The type, recursive, or max_depth query is invalid, or a recursive listing
            exceeds 10000 entries
        "403":
          description: Path escapes sandbox root, or permission is denied during path lookup or file open
        "404":
          description: Path does not exist within the sandbox
        "409":
          description: Path exists but is not of the kind requested by the type query
        "500":
          description: Permission is denied while reading a directory, or another internal filesystem error

    put:
      summary: Write or overwrite a file, or create a directory (Idempotent unless append=true)
      description: >
        Atomically writes request body to the given path using a temporary file and rename strategy.
        File writes create missing parent directories automatically. Supports both new file creation and overwriting.
        With append=true the body is added to the end of the file instead, which is not atomic
        or idempotent: retrying an append adds the body again.
        With type=directory the request creates an empty directory instead and ignores the body.
        It succeeds when the directory already exists. Missing parents need parents=true.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [file, directory]
            default: file
          description: >
            Kind of path to create. Use directory to create a directory, which cannot be combined
            with append=true.
        - name: parents
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Only with type=directory. If true, also creates missing parent directories. Otherwise a
            missing parent fails with 404.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            pattern: "^0[0-7]{3}$"
          description: >
            Octal permission bits applied to the written file (e.g. "0755" or "0644").
            Defaults to "0644" for files and "0755" for directories.
            With append=true, applied only when the request creates the file.
            With type=directory, the bits apply only to a directory the request creates.
        - name: append
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            If true, appends the body to the file, creating it if it does not exist.
            Readers can see a partial append, and concurrent appends can interleave.
      requestBody:
        required: false
        description: File content. Required unless type=directory, which ignores it.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "204":
          description: File written or directory created successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Remove a file or directory
      parameters:
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, recursively removes directory and all its contents.
      responses:
        "204":
          description: Removed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /files/{path}:move:
    parameters:
      - $ref: "#/components/parameters/FilePath"
    post:
      summary: Move or rename a file or directory
      description: >
        Renames the path to the destination query path, creating missing parent directories.
        A move within one filesystem is atomic. Across filesystems it copies and then removes
        the source, so both paths are briefly absent. The destination must not exist, except that overwrite=true
        replaces an existing file with a file. A directory is never replaced and cannot move
        into itself. The check for an existing destination is not atomic with the move.
        A symlink in the final component of either path is not followed: the move applies
        to the link itself. Symlinks in parent directories are followed within the sandbox root.
      parameters:
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/Overwrite"
      responses:
        "204":
          description: Moved successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /files/{path}:copy:
    parameters:
      - $ref: "#/components/parameters/FilePath"
    post:
      summary: Copy a file or directory
      description: >
        Copies the path to the destination query path, creating missing parent directories.
        A directory is copied recursively. A file keeps its permission bits, and a symlink
        inside a copied directory is copied as a link. Each copy is published atomically, so
        a failed copy leaves no partial destination. The destination must not exist, except
        that overwrite=true replaces an existing file with a file. A directory is never
        replaced and cannot be copied into itself. The check for an existing destination is
        not atomic with the copy. A symlink in the final component of either path is not
        followed: a copied symlink is recreated as a link. Symlinks in parent directories are
        followed within the sandbox root.
      parameters:
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/Overwrite"
      responses:
        "204":
          description: Copied successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      security: []
      summary: Sandbox readiness and heartbeat check
      description: >
        Used by orchestrators and Kubernetes liveness/readiness probes to verify sandboxd is healthy.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable or not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metadata:
    get:
      summary: Runtime environment metadata
      description: >
        Returns workload-scoped environment configuration injected by the orchestrator
        (e.g. sandbox ID, workspace path, resource limits).
        Security restriction: this endpoint must only serve non-sensitive configuration.
        Orchestrator credentials, Kubernetes API tokens, and cloud provider IAM keys must NEVER
        be served or placed in /v1/metadata since untrusted agent code running in the sandbox
        can query localhost.
      responses:
        "200":
          description: Runtime metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"

components:
  parameters:
    FilePath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: >
        Sandbox-relative path (e.g. main.py or src/main.py).
        Nested paths may use literal '/' separators or percent-encoded '%2F'.
        The supported SDKs encode the complete path value. The server decodes
        the request path before resolving it against the sandbox root.

    Destination:
      name: destination
      in: query
      required: true
      schema:
        type: string
      description: Sandbox-relative path to move or copy to, resolved like the path parameter.

    Overwrite:
      name: overwrite
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: If true, replaces an existing destination file with a file. Directories are never replaced.

    ExpectedType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [file, directory]
      description: >
        Kind of path the client expects. If the path exists but is the other kind,
        the request fails with 409 instead of returning the other representation.
        Omit it to accept either.
    ListRecursive:
      name: recursive
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >
        If true, a directory listing also includes the contents of nested directories.
        Symlinks to directories are listed but not entered. A subdirectory that cannot
        be read is listed without its contents. Ignored for files.
    ListMaxDepth:
      name: max_depth
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: >
        With recursive=true, the number of directory levels to list. 1 lists only the
        direct children. Omit it for no depth limit. A listing of more than 10000
        entries fails with 400. Ignored unless recursive=true.

  schemas:
    DirectoryListing:
      type: object
      required:
        - path
        - entries
      properties:
        path:
          type: string
          example: "/workspace"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"

    FileEntry:
      type: object
      required:
        - name
        - size
        - type
        - modified_at
      properties:
        name:
          type: string
          description: >
            Entry name. In a recursive listing, the path relative to the listed directory
            with "/" separators, and a directory comes before its contents.
          example: "main.py"
        size:
          type: integer
          format: int64
          example: 1024
        type:
          type: string
          enum: [file, directory]
          example: "file"
        modified_at:
          type: string
          format: date-time
        mode:
          type: string
          description: Octal permission bits
          example: "0644"

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
          example: "ok"
        uptime_seconds:
          type: integer
          example: 3600

    MetadataResponse:
      type: object
      properties:
        env:
          type: object
          additionalProperties:
            type: string
          description: Key-value environment variables injected by the orchestrator.

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "PERMISSION_DENIED"
        message:
          type: string
          example: "Path traversal outside sandbox root is forbidden."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required on every request except GET /v1/health when sandboxd runs with --auth-token-sha256 or --auth-token-file.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token (only when sandboxd runs with --auth-token-sha256 or --auth-token-file)
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Path escapes sandbox root or permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Path does not exist within the sandbox
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The path's current state conflicts with the request, for example a directory
        that is not empty when recursive=false, a path that is not of the kind
        requested by the type query, or a file at the path when type=directory
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal filesystem error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
