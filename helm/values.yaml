namespace:
  # create controls whether the namespace is created by this chart.
  create: true
  name: agent-sandbox-system

image:
  repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
  tag: ""  # required, eg. v0.3.10
  pullPolicy: IfNotPresent

# imagePullSecrets adds image pull secrets to the controller PodSpec (spec.template.spec.imagePullSecrets).
# Example:
# imagePullSecrets:
#   - name: my-registry-creds
imagePullSecrets: []
replicaCount: 1

# podAnnotations are added to the controller pod template.
# Useful for service-mesh sidecar injection toggles, Prometheus scrape
# autodiscovery (e.g. Datadog `ad.datadoghq.com/...`), or any platform-
# specific pod-level annotation.
podAnnotations: {}
  # ad.datadoghq.com/agent-sandbox-controller.check_names: '["openmetrics"]'
  # ad.datadoghq.com/agent-sandbox-controller.init_configs: '[{}]'
  # ad.datadoghq.com/agent-sandbox-controller.instances: |
  #   [{"openmetrics_endpoint": "http://%%host%%:8080/metrics", "namespace": "agent_sandbox", "metrics": [".*"]}]

# podLabels are added to the controller pod template, in addition to
# the chart's selector labels. Useful for cost-allocation labels,
# network policy selectors, or pod-level metadata.
podLabels: {}
  # team: platform

controller:
  ##### Unset flags are omitted
  # clusterDomain: "cluster.local"
  leaderElect: true
  # leaderElectionNamespace: ""
  extensions: false
  # enableTracing: false
  # enablePprof: false
  # enablePprofDebug: false
  # pprofBlockProfileRate: 1000000
  # pprofMutexProfileFraction: 10
  # kubeApiQps: -1.0
  # kubeApiBurst: 10
  # sandboxConcurrentWorkers: 100
  ##### The following are only active when controller.extensions=true.
  # sandboxClaimConcurrentWorkers: 50
  # sandboxWarmPoolConcurrentWorkers: 1
  # sandboxTemplateConcurrentWorkers: 1
  # sandboxWarmPoolMaxBatchSize: 300  # max parallel sandbox create/delete batch in the SandboxWarmPool controller
  # sandboxWarmPoolReadinessGracePeriod: 5m         # how long a warm pool sandbox may stay non-Ready before it is considered stuck
  # sandboxWarmPoolUnschedulableRecheckInterval: 1m # re-check interval for pools holding unschedulable sandboxes past the grace period
  # enableWarmPoolEviction: true      # mark warm-pool-created pods as safe to evict
  ##### extraArgs passes additional flags not listed above (e.g. zap logging flags).
  extraArgs: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 128Mi
  # requests:
  #   cpu: 10m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Pod-level securityContext (spec.template.spec.securityContext). Default null — omitted unless set.
# Example for Kyverno / restricted Pod Security:
# podSecurityContext:
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
podSecurityContext: null

# Container-level securityContext for the controller. Default null — omitted unless set.
# Example:
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#       - ALL
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
containerSecurityContext: null

# controllerConfig populates the agent-sandbox-config ConfigMap.
# Keys that match tunable flag names override the compiled defaults.
# ConfigMap values take precedence over CLI flags passed to the controller.
# Helm value changes update the checksum/config annotation and roll the
# Deployment. Live edits to the ConfigMap (outside Helm) require a manual
# restart of the Deployment to take effect.
controllerConfig: {}
  # sandbox-concurrent-workers: "200"
  # sandbox-warm-pool-max-batch-size: "500"
  # enable-warm-pool-eviction: "false"

service:
  # name sets the name of the controller Service that exposes the metrics endpoint.
  name: agent-sandbox-controller

metrics:
  # serviceMonitor creates a Prometheus Operator ServiceMonitor that scrapes the
  # controller's /metrics endpoint via the controller Service. Requires the
  # prometheus-operator CRDs (monitoring.coreos.com/v1) to be installed.
  serviceMonitor:
    enabled: false
    # additionalLabels are added to the ServiceMonitor. Most Prometheus instances
    # only select ServiceMonitors matching their serviceMonitorSelector, e.g.:
    #   release: kube-prometheus-stack
    additionalLabels: {}
    interval: 30s
    # scrapeTimeout is omitted unless set (Prometheus defaults apply).
    scrapeTimeout: ""
  # prometheusRule creates a Prometheus Operator PrometheusRule with a small
  # starter alert set for the controller metrics endpoint. Requires the
  # prometheus-operator CRDs (monitoring.coreos.com/v1) to be installed.
  prometheusRule:
    enabled: false
    # additionalLabels are added to the PrometheusRule. Most Prometheus instances
    # only select PrometheusRules matching their ruleSelector, e.g.:
    #   release: kube-prometheus-stack
    additionalLabels: {}
    # additionalGroups appends additional Prometheus rule groups after the
    # chart's starter group. Each list item must be a full Prometheus rule
    # group object.
    additionalGroups: []
