# node-exporter for the stress test: node-level CPU (including iowait),
# memory and disk stats, which nothing else exposes (kubelet metrics only
# describe the kubelet process; cadvisor is deliberately not scraped).
# The stress tool scrapes :9100 through the apiserver pod proxy
# (see test/stress/promscrape.go), so the port needs no external exposure.
#
# Runs on every node INCLUDING the control plane (tolerations: Exists) --
# control-plane CPU starvation is precisely the condition this exists to
# measure, so it must survive there: system-node-critical priority and a
# small dedicated CPU request keep it scheduled and running on a saturated
# node. Restrict collectors to keep monitoring overhead low.
#
# Live and dying cgroup counts help distinguish workload growth from delayed
# kernel cleanup. Correlating dying cgroups with node memory and pod startup
# latency helps diagnose resource retention under pod churn.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --web.listen-address=:9100
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.diskstats
            - --collector.loadavg
            - --collector.textfile
            - --collector.textfile.directory=/textfile
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          # The enabled collectors read world-readable host files and the sidecar's
          # textfile output, so run unprivileged (matching the upstream Helm chart's
          # defaults).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: textfile
              mountPath: /textfile
              readOnly: true
        # node-exporter does not expose cgroup.stat directly.
        - name: cgroup-stat
          image: quay.io/prometheus/node-exporter:v1.8.2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              trap 'rm -f /textfile/cgroup_stat.prom /textfile/cgroup_stat.prom.tmp' EXIT
              while true; do
                if [ -r /host/sys/fs/cgroup/cgroup.stat ] &&
                  awk '{ printf "# TYPE node_cgroup_stat_%s gauge\nnode_cgroup_stat_%s %s\n", $1, $1, $2 }' \
                    /host/sys/fs/cgroup/cgroup.stat > /textfile/cgroup_stat.prom.tmp; then
                  success=1
                else
                  success=0
                  : > /textfile/cgroup_stat.prom.tmp
                fi
                printf '# HELP node_cgroup_stat_collection_success Whether the last cgroup.stat collection succeeded.\n# TYPE node_cgroup_stat_collection_success gauge\nnode_cgroup_stat_collection_success %s\n' \
                  "$success" >> /textfile/cgroup_stat.prom.tmp
                mv /textfile/cgroup_stat.prom.tmp /textfile/cgroup_stat.prom
                sleep 15
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: textfile
              mountPath: /textfile
      volumes:
        - name: textfile
          emptyDir: {}
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
