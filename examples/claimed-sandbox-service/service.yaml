apiVersion: v1
kind: Service
metadata:
  name: claimed-sandbox-entry
spec:
  type: ClusterIP
  # Only Claims add this label; unclaimed reserve Pods never have it.
  selector:
    sandbox.users.io/serving-group: demo
  ports:
    - name: http
      port: 80
      targetPort: http
  # Keep readiness gating; do not use publishNotReadyAddresses: true.
  publishNotReadyAddresses: false
