# Timeout set to 7200s (2 hours) to allow sufficient time for build and push operations. 
timeout: 7200s
steps:
  # This step runs the python script to build and push the Docker image.
  # We use the gcloud builder because it comes with python and the docker client.
  - name: "gcr.io/k8s-staging-test-infra/gcb-docker-gcloud"
    entrypoint: "python3"
    args:
      - "./dev/tools/push-images"
      # Assuming the script accepts project and tag arguments.
      # Using standard Cloud Build substitutions.
      - "--image-prefix=${_IMAGE_PREFIX}/"
      - "--extra-image-tag=${_GIT_TAG}-${_CONFIG}"
      - "--extra-image-tag=latest-${_CONFIG}"
  # Publishes the Helm chart for stable release tags only; other refs skip
  # without installing Helm.
  - name: "gcr.io/k8s-staging-test-infra/gcb-docker-gcloud"
    entrypoint: "bash"
    env:
      - PULL_BASE_REF=${_PULL_BASE_REF}
    args:
      - "-c"
      - |
        set -o errexit
        if [[ ! "$$PULL_BASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$$ ]]; then
          echo "skipping chart publish: $$PULL_BASE_REF is not a stable release tag"
          exit 0
        fi
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        make helm
        python3 ./dev/tools/push-chart \
          --helm-bin=./bin/helm \
          --staging-repo="${_IMAGE_PREFIX}/charts" \
          --tag="$$PULL_BASE_REF"

options:
  enableStructuredLogging: true
  # Using a more powerful machine type can speed up docker builds.
  machineType: "E2_HIGHCPU_32"
  substitution_option: "ALLOW_LOOSE"
substitutions:
  _GIT_TAG: "12345"
  _CONFIG: main
  _PULL_BASE_REF: main
  _IMAGE_PREFIX: "us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox"
