apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: ci-runner-template
spec:
  podTemplate:
    spec:
      # CI jobs run untrusted code from pull requests; the pod needs no
      # Kubernetes API access.
      automountServiceAccountToken: false
      restartPolicy: "OnFailure"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: ci-runner
        # Built from the Dockerfile in this directory:
        #   docker build -t ci-runner-sandbox:v1 .
        # kind-local image; for real clusters push to a registry and switch
        # this to IfNotPresent (see README).
        image: ci-runner-sandbox:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: "/"
            port: 8888
        livenessProbe:
          httpGet:
            path: "/"
            port: 8888
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "2Gi"
          limits:
            ephemeral-storage: "5Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      # CI jobs are one-shot: a scratch workspace per sandbox is enough, and
      # it disappears with the pod. Use volumeClaimTemplates instead when
      # jobs need a dependency cache that survives across runs.
      - name: workspace
        emptyDir: {}
