# Standard operator-sdk layout; content is derived from parent k8s/ (see Makefile manifests).
# Router image remap lives here so `kustomize edit set image`
# during `make bundle` does not fight verify-olm.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# [Optional] Controller NetworkPolicy: uncomment ../network-policy to deploy
# ingress/egress restrictions for the controller pod. Required by compliance
# frameworks (SOC 2, FedRAMP, PCI-DSS, CIS Kubernetes benchmarks) that mandate
# network segmentation for control-plane components. Commented out by default
# because egress-deny semantics can break clusters with non-standard API server
# endpoints, private proxies, or CNI/DNS configurations. See
# k8s/networkpolicy.yaml for the full policy and tuning guidance.
resources:
- ../crd
- ../rbac
- ../manager
- ../sandbox-router
# [Optional] Prometheus ServiceMonitor: uncomment to include a ServiceMonitor
# in the OLM bundle so Prometheus can scrape the controller's metrics endpoint.
# When --metrics-secure-serving is enabled, also update scheme and tlsConfig in
# config/prometheus/monitor.yaml (see docs/configuration.md "Enabling secure
# metrics end-to-end").
# - ../prometheus
# - ../network-policy
images:
- name: registry.k8s.io/agent-sandbox/sandbox-router-go
  newName: registry.k8s.io/agent-sandbox/sandbox-router-go
  newTag: v1.0.0
