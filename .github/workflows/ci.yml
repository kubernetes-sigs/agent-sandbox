name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "api/**"
      - "extensions/**"
      - "controllers/**"
      - "helm/**"
      - "cmd/**"
      - "dev/tools/fix-*"
      - "dev/tools/bump-chart-version"
      - "dev/tools/verify-chart-version"
      - "dev/ci/presubmits/**"
      - "codegen.go"

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  verify-generate:
    name: Verify Generated Files Up To Date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # actions/checkout only configures a refspec for the PR ref, so
      # origin/<base> is absent even at fetch-depth: 0. The chart version check
      # needs it to find the merge base.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Run autogen check
        run: dev/ci/presubmits/test-autogen-up-to-date
