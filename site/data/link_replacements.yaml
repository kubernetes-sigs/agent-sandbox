# Link replacement rules for include-file shortcode
# Each rule consists of a pattern (regex) and a replacement URL
# Rules are applied in the order they appear

replacements:
  # sandboxd user guide - redirect repository-relative links to canonical sources
  - pattern: '\]\(\.\./\.\./docs/keps/539\.2-runtime-standardization/README\.md\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/docs/keps/539.2-runtime-standardization/README.md)'
    description: "sandboxd KEP to GitHub"

  - pattern: '\]\(spec/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/tree/main/packages/sandboxd/spec/)'
    description: "sandboxd spec directory to GitHub"

  - pattern: '\]\(spec/([^)]+)\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/packages/sandboxd/spec/$1)'
    description: "sandboxd spec files to GitHub"

  - pattern: '\]\(\.\./\.\./examples/sandboxd-sandbox/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/sandboxd-sandbox/)'
    description: "sandboxd example to GitHub"

  # Python SDK README - redirect to GitHub
  - pattern: '\]\(clients/python/agentic-sandbox-client/README\.md(#[^)]+)?\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/README.md$1)'
    description: "Python SDK README to GitHub"

  # Python SDK README from examples/* (relative paths) - redirect to GitHub
  - pattern: '\]\(\.\./\.\./clients/python/agentic-sandbox-client/README\.md(#[^)]+)?\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/README.md$1)'
    description: "Relative Python SDK README to GitHub"

  # Examples link - redirect to /docs/use-cases/examples/
  - pattern: '\]\(examples/\)'
    replacement: '](/docs/use-cases/examples/)'
    description: "Examples directory to docs/examples"

  # Warmpool quickstart examples - redirect to GitHub
  - pattern: '\]\(\.\./warmpool-quickstart/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/warmpool-quickstart)'
    description: "Warmpool quickstart examples to GitHub"

  # Agentic-sandbox-client Python SDK (relative paths) - redirect to GitHub
  - pattern: '\]\(\.\./\.\./clients/python/agentic-sandbox-client/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/)'
    description: "Agentic-sandbox-client relative path to GitHub"

  # deer-flow-sandbox README - sandboxd package to GitHub
  - pattern: '\]\(\.\./\.\./packages/sandboxd/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/tree/main/packages/sandboxd/)'
    description: "DeerFlow example sandboxd package to GitHub"

  # deer-flow-sandbox README - sibling examples
  - pattern: '\]\(\.\./sandboxd-sandbox/\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/sandboxd-sandbox/)'
    description: "DeerFlow example link to sandboxd-sandbox to GitHub"

  - pattern: '\]\(\.\./composing-sandbox-nw-policies/\)'
    replacement: '](/docs/use-cases/examples/composing-sandbox-nw-policies/)'
    description: "DeerFlow example link to composing-sandbox-nw-policies docs page"

  # deer-flow-sandbox README - in-directory file links to GitHub
  - pattern: '\]\(\./(agent_sandbox_provider/provider\.py|agent_sandbox_provider/parsing\.py|test_parsing\.py|sandbox-template\.yaml|warmpool\.yaml|main\.py)\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/examples/deer-flow-sandbox/$1)'
    description: "DeerFlow example file links to GitHub"

  # JupyterLab installation guide - specific to experiment.md
  - pattern: '\]\(\./README\.md\)'
    replacement: '](/docs/use-cases/examples/jupyterlab/)'
    description: "JupyterLab README to docs page"

  # Installation section from getting started
  - pattern: '\]\(/README\.md/#installation\)'
    replacement: '](/docs/getting_started/overview/#installation)'
    description: "Root README installation to docs/getting_started/overview"

  # Agent sandbox router - redirect to GitHub
  - pattern: '\]\(/clients/python/agentic-sandbox-client/README\.md(#[^)]+)\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/README.md$1)'
    description: "Agent sandbox router README to GitHub"

  # Sandbox-router README - redirect to GitHub
  - pattern: '\]\(sandbox-router/README\.md(#[^)]+)?\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/README.md$1)'
    description: "Sandbox-router README to GitHub"

  # test_client.py - redirect to GitHub
  - pattern: '\]\(test_client\.py\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/test_client.py)'
    description: "test_client.py to GitHub"

  # Python-runtime-sandbox README (absolute repo path) - redirect to /docs/runtime-templates/python/
  - pattern: '\]\(/examples/python-runtime-sandbox/README\.md\)'
    replacement: '](/docs/runtime-templates/python/)'
    description: "Python runtime sandbox README absolute path to docs page"

  # Python-runtime-sandbox (relative path 3 levels up) - redirect to /docs/runtime-templates/python/
  - pattern: '\]\(\.\./\.\./\.\./examples/python-runtime-sandbox/\)'
    replacement: '](/docs/runtime-templates/python/)'
    description: "Python runtime sandbox to docs page"

  # Python SDK README (absolute repo path, no anchor) - redirect to /docs/python-client/
  - pattern: '\]\(/clients/python/agentic-sandbox-client/README\.md\)'
    replacement: '](/docs/python-client/)'
    description: "Python SDK README absolute path (no anchor) to docs page"

  # Tracing with GCP - redirect to GitHub
  - pattern: '\]\(GCP\.md(#[^)]+)\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/python/agentic-sandbox-client/GCP.md$1)'
    description: "GCP.md to GitHub"

  # Go client source links - redirect to GitHub
  - pattern: '\]\(sandbox/options\.go\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/go/sandbox/options.go)'
    description: "Go client options.go to GitHub"

  # TypeScript client links
  - pattern: '\]\(\.\./\.\./go/README\.md\)'
    replacement: '](/docs/go-client/)'
    description: "TypeScript client link to Go client docs page"

  - pattern: '\]\(\.\./\.\./python/agentic-sandbox-client/README\.md\)'
    replacement: '](/docs/python-client/)'
    description: "TypeScript client link to Python client docs page"

  - pattern: '\]\(package\.json\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/typescript/agentic-sandbox-client/package.json)'
    description: "TypeScript client package.json to GitHub"

  - pattern: '\]\(src/index\.ts\)'
    replacement: '](https://github.com/kubernetes-sigs/agent-sandbox/blob/main/clients/typescript/agentic-sandbox-client/src/index.ts)'
    description: "TypeScript client src/index.ts to GitHub"

  # Generic relative README.md links (must come after specific rules)

  - pattern: '\]\(README\.md(#[^)]+)?\)'
    replacement: null  # Will be dynamically replaced with current section path
    description: "Generic README links to current section"
    dynamic: true


  # Generic ../../README.md or ../../INSTALL.md links
  - pattern: '\]\(\.\.\/\.\./(README|INSTALL)\.md(#[^)]+)?\)'
    replacement: '](/docs/getting_started/overview/$2)'
    description: "Parent directory README/INSTALL to docs/overview"
